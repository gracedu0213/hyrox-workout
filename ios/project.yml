name: HyroxWorkout
options:
  bundleIdPrefix: com.gracedu
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
targets:
  HyroxWorkout:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HyroxWorkout
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: HyroxWorkout/Info.plist
      properties:
        CFBundleDisplayName: Hyrox
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # DEBUG builds talk to the local Supabase stack over http://127.0.0.1 —
        # ATS blocks cleartext by default, so allow loopback/local networking.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gracedu.hyrox
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
  HyroxWorkoutTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HyroxWorkoutTests
    dependencies:
      - target: HyroxWorkout
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gracedu.hyrox.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HyroxWorkout.app/HyroxWorkout"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  HyroxWorkout:
    build:
      targets:
        HyroxWorkout: all
    test:
      targets:
        - HyroxWorkoutTests
